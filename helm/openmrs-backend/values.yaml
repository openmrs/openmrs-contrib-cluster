# Default values for openmrs-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  defaultStorageClass: "gp2"

  security:
    allowInsecureImages: true

  # Fallback for standalone rendering; a parent chart's own global.* wins over this.
  mariadb:
    enabled: false
    replicas: 2
    galera: true
    auth:
      database: openmrs
      username: openmrs
      password: OpenMRS123

replicaCount: 1

image:
  repository: openmrs/openmrs-reference-application-3-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

infinispan:
  clustered: false
  bind_port: 7800

db:
  hostname: mariadb
  port: 3306
  database: ""        # External DB name, falls back to "openmrs". Ignored when
                      # global.mariadb.enabled=true (uses global.mariadb.auth.database instead).
  url: ""             # Full JDBC URL override, takes precedence over hostname/port/database.
                      # Ignored when global.mariadb.enabled=true.
  username: openmrs
  password: OpenMRS123

elasticsearch:
  enabled: false
  uris: ""            # When non-empty, the workload ConfigMap/Secret add hibernate
                      # search backend URIs/credentials (external search clusters).
  username: ""
  password: ""

imagePullSecrets: []

persistence:
  enabled: true
  size: 8Gi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001
  runAsUser: 1001
  fsGroupChangePolicy: "Always"

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1001


service:
  type: ClusterIP
  port: 8080

gateway:
  enabled: true
  path: /openmrs/
  parentRefs:
    name: traefik-gateway
    namespace: openmrs-system

traefikService:
  enabled: false
  sticky:
    cookie:
      secure: false

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "http-cookie"
    nginx.ingress.kubernetes.io/session-cookie-expires: "43200"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "43200"
  rules:
    - http:
      paths:
        - path: /openmrs/
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
     cpu: 4.0
     memory: 4Gi
  requests:
     cpu: 1000m
     memory: 2Gi

livenessProbe:
  httpGet:
    path: /openmrs/health/started
    port: 8080
  failureThreshold: 3
  timeoutSeconds: 1
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /openmrs/health/started
    port: 8080
  initialDelaySeconds: 60
  failureThreshold: 10
  timeoutSeconds: 5
  periodSeconds: 15
startupProbe:
  httpGet:
    path: /openmrs/health/started
    port: 8080
  initialDelaySeconds: 20
  failureThreshold: 120
  timeoutSeconds: 1
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

seaweedfs:
  enabled: false
  admin:
    enabled: false
    urlPrefix: /seaweedfs-admin
    httpRoute:
      enabled: false
      parentRefs:
        name: traefik-gateway
        namespace: openmrs-system
      hostnames:
        - localhost
  # Must match the umbrella's top-level seaweedfs.s3.credentials.admin.*.
  s3:
    credentials:
      admin:
        accessKey: "openmrs"
        secretKey: "OpenMRS123"
