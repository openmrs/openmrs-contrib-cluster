{{- if .Values.dbBootstrap.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-credentials
  labels:
    {{- include "openmrs-tenant.labels" . | nindent 4 }}
    k8s.mariadb.com/watch: ""
type: Opaque
stringData:
  password: {{ (index .Values "openmrs-backend").db.password | quote }}
{{- end }}
