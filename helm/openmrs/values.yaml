# Default values for openmrs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  defaultStorageClass: "gp2"
  defaultIngressClass: "traefik"

  # Shared by the umbrella's MariaDB CR (below) and openmrs-backend's connection.
  mariadb:
    enabled: true
    galera: true
    replicas: 2
    auth:
      database: openmrs
      username: openmrs
      password: OpenMRS123

openmrs-backend:
  nameOverride: "backend"

  infinispan:
    clustered: false
    bind_port: 7800

  db:
    hostname: ""       # external DB hostname; only used when global.mariadb.enabled=false
    port: 3306
    database: ""       # external DB name; falls back to "openmrs"
    username: openmrs
    password: OpenMRS123

  # Workload wiring only: the backend StatefulSet/ConfigMap/Secret/Role read
  # these to enable S3 storage, Elasticsearch volumes/wait-loop and S3 creds.
  # The actual infra is deployed by the umbrella's own deps (see below).
  elasticsearch:
    enabled: false

  # Must match the umbrella's top-level seaweedfs.s3.credentials.admin.* below.
  seaweedfs:
    enabled: false
    s3:
      credentials:
        admin:
          accessKey: "openmrs"
          secretKey: "OpenMRS123"

openmrs-frontend:
  enabled: true
  nameOverride: "frontend"
  rootRedirect:
    hostnames:
      - localhost

# Infra owned by the umbrella (primary deployment). The tenant chart
# consumes the shared backend/frontend charts only and has none of this.

mariadb:
  image:
    repository: mariadb
    tag: "10.11"
  auth:
    rootPassword: Root123 # umbrella-only; the backend workload never needs root
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

elasticsearch:
  enabled: false

elasticsearch-eck:
  version: "8.15.3"
  image: openmrs/openmrs-contrib-elasticsearch:8.15.3

  nodeSets:
    - name: default
      count: 3
      config:
        node.roles:
          - master
          - data
          - ingest
        node.store.allow_mmap: false

      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: "2Gi"
                  ephemeral-storage: 2Gi
                limits:
                  cpu: 750m
                  memory: "2Gi"
                  ephemeral-storage: 10Gi

  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

seaweedfs:
  enabled: false
  master:
    replicas: 3
  volume:
    enabled: true
    replicas: 3
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        # EKS default SC; non-EKS must override (Kind does, in kind-openmrs.yaml). The subchart
        # renders storageClassName unconditionally, so "" would leave the PVC Pending.
        storageClass: "gp2"
        size: "8Gi"
        maxVolumes: 0
  filer:
    enabled: true
    replicas: 3
    extraEnvironmentVars:
      WEED_MYSQL_ENABLED: "true"
      WEED_MYSQL_HOSTNAME: "{{ .Release.Name }}-mariadb"
      # Must match global.mariadb.auth.database/username above.
      WEED_MYSQL_DATABASE: "openmrs"
      WEED_MYSQL_USERNAME: "openmrs"
      WEED_LEVELDB2_ENABLED: "false"
    secretExtraEnvironmentVars:
      WEED_MYSQL_PASSWORD:
        secretKeyRef:
          name: "openmrs-backend-mariadb-secret"
          key: user-password
  admin:
    enabled: false
    urlPrefix: /seaweedfs-admin
    ingress:
      enabled: false
    httpRoute:
      enabled: false
      parentRefs:
        name: traefik-gateway
        namespace: openmrs-system
      hostnames:
        - localhost
  s3:
    enabled: true
    replicas: 2
    # false = filer-backed dynamic IAM: gateway reads identities from the filer, so
    # per-tenant s3-bootstrap identities work and hot-reload; the primary's bucket-scoped
    # identity is seeded by the s3Seed hook below. true = static -config file (no runtime tenants).
    enableAuth: false
    # Only consumed when enableAuth=true (static -config). The default filer-backed mode
    # uses openmrs-backend.seaweedfs.s3.credentials.admin.* instead; this has no effect there.
    credentials:
      admin:
        accessKey: "openmrs"
        secretKey: "OpenMRS123"

# Seeds the primary's bucket-scoped identity + primary bucket into the filer-backed IAM store (only when
# enableAuth=false). Reads openmrs-backend.seaweedfs.s3.credentials.admin.* (the key the
# backend uses); bucket follows openmrs-backend.seaweedfs.s3.bucketName.
s3Seed:
  enabled: true
  image: "chrislusf/seaweedfs:4.31"
  # Caps the seed Job (post-install hook races cold-start when installed without --wait);
  # keep under the install --timeout so a real hang surfaces as a Job failure, not a helm timeout.
  activeDeadlineSeconds: 240

monitoring:
  enabled: false

grafana:
  adminPassword: "Admin123"
  grafana.ini: # Needed for serving from path
    server:
      domain: localhost
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/logs-dashboard.json
    log:
      level: warn
    dataproxy:
      timeout: 300
      keep_alive_seconds: 300
  ingress:
    enabled: false
    hosts:
      - "localhost"
    path: '/grafana'
  route: {}
  # Custom HTTPRoute config used by grafana-httproute.yaml
  httpRoute:
    enabled: false
    parentRefs:
      name: traefik-gateway
      namespace: openmrs-system
    hostnames:
      - localhost
    path: /grafana
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          url: "http://{{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc.cluster.local:3100"
          access: proxy
          isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: "logs-dashboard"

loki:
  deploymentMode: SingleBinary
  # Explicitly disable scalable targets to satisfy validation when using filesystem storage
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
  test:
    enabled: false
  lokiCanary:
    enabled: false
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    server:
      log_level: warn
      http_server_read_timeout: 300s
      http_server_write_timeout: 300s
    limits_config:
      retention_period: 14d
      query_timeout: 300s
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    storage:
      type: 'filesystem'
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

alloy:
  alloy:
    configMap:
      create: false
      name: alloy-config
  controller:
    type: daemonset

# Velero backup and restore (optional feature, TRUNK-6608).
backup:
  enabled: false

  # How often to take a backup. Default is every day at 02:00 UTC.
  schedule: "0 2 * * *"

  # How long to keep backups before they are deleted. Default is 30 days.
  ttl: "720h0m0s"

  # The S3 bucket where backups will be stored.
  bucket: ""

  # The AWS region where the S3 bucket lives.
  region: "us-east-1"

  # Set to true only if using MinIO, SeaweedFS or other S3-compatible endpoints.
  # Leave as false for standard AWS S3.
  s3ForcePathStyle: false

  # S3-compatible endpoint URL. Required when using SeaweedFS or MinIO.
  # For SeaweedFS running in the same cluster, use the SeaweedFS S3 service URL.
  # Example: "http://openmrs-seaweedfs-s3.openmrs.svc.cluster.local:8333"
  # Leave empty for standard AWS S3.
  s3Url: ""

  # AWS credentials for accessing the S3 bucket (Velero and the bucket-setup Job).
  # These will be stored as a Kubernetes secret, never in plain text.
  credentials:
    accessKey: ""
    secretKey: ""

  # Restore settings.
  restore:
    # Set to true to enable the scheduled restore CronJob.
    # Disabled by default — restoring data should be an admin-triggered action.
    enabled: false

    # Schedule for the daily restore job.
    # Runs after the backup, e.g. if backup is at 02:00 restore runs at 03:00.
    schedule: "0 3 * * *"

    # Image used to submit the scheduled Restore via kubectl. Override to
    # repoint without a chart change (e.g. if the default tag stops
    # resolving on your registry).
    image: "registry.k8s.io/kubectl:v1.30.14"

  # The namespace where Velero is installed.
  # Velero stores its Backup and Restore resources in its own namespace.
  veleroNamespace: "velero"

  # MariaDB backup settings — runs a dedicated CronJob that dumps the DB directly to S3,
  # independent of Velero.
  mariadbBackup:
    enabled: false
    schedule: "30 1 * * *"

    # Image used to run mysqldump. Defaults to "mariadb:<mariadb.image.tag>" so it
    # tracks the version deployed by the umbrella. Override to repoint without a
    # chart change (e.g. if the default tag stops resolving on your registry).
    image: ""

    bucket: ""
    region: "us-east-1"
    s3ForcePathStyle: false

    # S3-compatible endpoint URL. Only needed for MinIO or other non-AWS endpoints.
    # Example: "http://minio.minio-namespace.svc.cluster.local:9000"
    s3Endpoint: ""

    # MariaDB primary host. Defaults to {{ .Release.Name }}-mariadb-primary
    # if left empty. Override this if you use nameOverride on the MariaDB sub-chart.
    mariadbHost: ""

    # Secret holding the MariaDB root/admin password used to run mysqldump.
    # Left empty, this defaults to the umbrella's own MariaDB secret
    # ({release}-backend-mariadb-secret, key root-password), which only
    # exists when global.mariadb.enabled=true. Set both when dumping a
    # MariaDB the chart did not deploy — same case mariadbHost above
    # anticipates. Required (render fails otherwise) when
    # global.mariadb.enabled=false.
    rootPasswordSecret:
      name: ""
      key: "root-password"

    # AWS credentials for uploading the dump to S3.
    # These will be stored as a Kubernetes secret, never in plain text.
    credentials:
      accessKey: ""
      secretKey: ""
