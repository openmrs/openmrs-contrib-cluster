{{- if .Values.backup.enabled }}
{{- /*
  Pre-install check — verifies Velero CRDs are registered before
  creating backup resources 

  NOTE: During offline rendering (helm template without --kube-apiserver),
  Helm populates .Capabilities with a default API list that does not include
  Velero CRDs. To render backup manifests offline (e.g. for testing or CI),
  pass --api-versions velero.io/v1/Schedule to helm template.

  During helm install/upgrade on a real cluster, this check correctly
  catches missing Velero and fails with a clear error message.
*/}}
{{- if .Capabilities.APIVersions.Has "velero.io/v1/Schedule" }}
{{- /* Velero CRDs confirmed present — safe to proceed */}}
{{- else if not (empty .Capabilities.KubeVersion.Version) }}
{{- /*
  Only fail when connected to a real cluster (KubeVersion is set).
  This allows offline helm template rendering to pass without
  needing --api-versions flags.
*/}}
{{- fail "Velero is not installed on this cluster. Please install Velero before enabling backup.enabled=true. See https://velero.io/docs/latest/basic-install/" }}
{{- end }}
{{- end }}