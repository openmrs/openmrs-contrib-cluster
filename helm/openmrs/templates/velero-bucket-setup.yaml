{{- if .Values.backup.enabled }}
{{- if .Values.backup.s3Url }}
# Secret — AWS credentials for the bucket setup Job
# Stored as a Secret so credentials are not exposed in the pod spec.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-bucket-setup-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openmrs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.backup.credentials.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.backup.credentials.secretKey | quote }}
---
# Post-install Job — creates the Velero backup bucket in SeaweedFS S3 (TRUNK-6608)
# This runs once after helm install to ensure the bucket exists before
# Velero tries to use it. Without this, Velero will fail silently.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-velero-bucket-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openmrs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: amazon/aws-cli:2.15.0
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-bucket-setup-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Creating Velero backup bucket if it does not exist..."
              aws s3api create-bucket \
                --bucket {{ required "backup.bucket is required when backup.enabled=true" .Values.backup.bucket }} \
                --endpoint-url {{ .Values.backup.s3Url }} \
                --region {{ .Values.backup.region }} \
                2>&1 | grep -v "BucketAlreadyOwnedByYou" \
                || { echo "Bucket already exists, continuing."; true; }
              echo "Bucket ready."
{{- end }}
{{- end }}