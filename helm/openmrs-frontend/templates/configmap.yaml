apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmrs-frontend.fullname" . }}
  labels:
    {{- include "openmrs-frontend.labels" . | nindent 4 }}
data:
  SPA_PATH: {{ .Values.spaPath | quote }}
  API_URL: {{ .Values.apiUrl | quote }}
  SPA_CONFIG_URLS: {{ .Values.configUrls | quote }}
  SPA_DEFAULT_LOCALE: {{ .Values.defaultLocale | quote }}
