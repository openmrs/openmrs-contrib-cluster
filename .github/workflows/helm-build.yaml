name: Helm Build

on:
  push:
    paths:
      - 'helm/**'
  pull_request:
    paths:
      - 'helm/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.4

      - name: Add Helm Repositories
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add elastic https://helm.elastic.co
          helm repo update

      - name: Lint Subcharts
        run: |
          helm lint helm/openmrs-backend
          helm lint helm/openmrs-frontend

      - name: Update Subchart Dependencies
        run: |
          helm dependency update helm/openmrs-backend
          helm dependency update helm/openmrs-frontend

      - name: Update Dependencies
        run: helm dependency update helm/openmrs

      - name: Lint Main Chart
        run: helm lint helm/openmrs

      - name: Package Chart
        run: helm package helm/openmrs

      - name: Validate Rendering (default values)
        run: helm template helm/openmrs --generate-name

      - name: Validate Rendering (full-featured)
        run: |
          helm template helm/openmrs --generate-name \
            --values helm/kind-openmrs.yaml

      - name: Validate Rendering (minimal, no optional features)
        run: |
          helm template helm/openmrs --generate-name \
            --set openmrs-backend.monitoring.enabled=false \
            --set openmrs-backend.elasticsearch.enabled=false \
            --set openmrs-backend.seaweedfs.enabled=false

      - name: Validate Rendering (external database)
        run: |
          helm template helm/openmrs --generate-name \
            --set openmrs-backend.mariadb.enabled=false \
            --set openmrs-backend.db.database=openmrs_rds \
            --set openmrs-backend.db.username=rdsuser > /tmp/external-db.yaml
          grep -q 'OMRS_DB_USERNAME: "rdsuser"' /tmp/external-db.yaml
          grep -q 'OMRS_DB_NAME: "openmrs_rds"' /tmp/external-db.yaml

      - name: Lint and Render Tenant Chart
        run: |
          TENANT_VALUES="--set tenant.name=ci \
            --set backend.db.hostname=mariadb.example.svc.cluster.local \
            --set backend.db.database=openmrs_ci \
            --set backend.db.user=ci_user \
            --set backend.db.password=ci-pass"
          helm lint helm/openmrs-tenant $TENANT_VALUES
          helm template helm/openmrs-tenant --generate-name $TENANT_VALUES
          helm template helm/openmrs-tenant --generate-name $TENANT_VALUES \
            --set backend.infinispan.clustered=true
